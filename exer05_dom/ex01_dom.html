<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>DOM 선택 실습</title>
    <script>
        window.onload = function() {
            // TODO 1. ID로 제목 선택 및 색상 변경
            let title1 = document.getElementById("title");
            title1.style.color = "Blue";

            // TODO 2. h2 선택 및 텍스트 변경

            document.querySelector("h2").innerHTML = "JavaScript로 변경한 제목"

            // TODO 3. class로 여러 요소 선택 및 색상 변경
            let ClassItems = document.getElementsByClassName("item");

            for(let i = 0; i < ClassItems.length; i++){
                let ClassItem = ClassItems[i];

                ClassItem.style.color = "red";
            };

            // TODO 4. name으로 여러 요소 선택 및 배경색 변경

            let NameMessages = document.getElementsByName("message");
            
            for(let i = 0; i < NameMessages.length; i++){
                let NameMessage = NameMessages[i];

                NameMessage.style.background = "yellow";
            };

            // TODO 5. 모든 p 요소 선택 및 글자 굵게 변경

            let AllTexts = document.querySelectorAll("p");

            for(let i = 0; i < AllTexts.length; i++){
                let AllText = AllTexts[i];

                AllText.style.fontWeight = "bold";
            };
        };
    </script>
</head>
<body>
    <h1 id="title">DOM 선택 실습</h1>
    <h2>기존 제목</h2>

    <p class="item">첫 번째 항목</p>
    <p class="item">두 번째 항목</p>
    <p class="item">세 번째 항목</p>

    <p name="message">안녕하세요!</p>
    <p name="message">JavaScript 실습입니다.</p>
</body>
</html>
